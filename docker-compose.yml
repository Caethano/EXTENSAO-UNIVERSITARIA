# WordPress com o plugin Festa dos Amigos 2026 pronto para usar.
#
#   docker compose up -d --build
#
# Site em http://localhost:8080 e e-mails em http://localhost:8025.
# Tudo tem padrão; para mudar portas, senhas e idioma, copie .env.example para .env.

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  wordpress:
    build: .
    image: festa-amigos-2026:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: ${WP_DEBUG:-0}
      # O endereço do site vem do WP_URL: trocar a porta não exige mexer no banco.
      # Com WP_DEBUG=1, os avisos do PHP vão para "docker compose logs wordpress".
      WORDPRESS_CONFIG_EXTRA: |
        if (getenv('WP_URL')) {
            define('WP_HOME', getenv('WP_URL'));
            define('WP_SITEURL', getenv('WP_URL'));
        }
        define('WP_DEBUG_DISPLAY', false);
      WP_URL: ${WP_URL:-http://localhost:${WP_PORT:-8080}}
      WP_TITLE: ${WP_TITLE:-Festa dos Amigos 2026}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@festa.local}
      WP_LOCALE: ${WP_LOCALE:-pt_BR}
      WP_TIMEZONE: ${WP_TIMEZONE:-America/Sao_Paulo}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    volumes:
      - wp_data:/var/www/html
      # Documentos dos participantes e chaves de criptografia dos CPFs.
      - festa_privado:/var/www/festa-uploads-privados

  # Caixa de entrada de teste: recebe todos os e-mails que o site envia.
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIL_PORT:-8025}:8025"

volumes:
  db_data:
  wp_data:
  festa_privado:
